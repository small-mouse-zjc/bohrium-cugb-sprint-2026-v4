package: 05-repro-guard
single_point: 正文数值全部溯源 + 步骤四要素 + 复现九项
scoring:
  实际效果_40:
    任务完成度_15: 章节六要素（步骤/设置/参数/数据/对照/复现与限制）齐全
    结果正确性_15: 参数与配置/日志/代码一致，无冲突值、无凭空数值
    结果完整性_5: 参数台账覆盖正文全部声明参数；复现九项齐全
    结果可核验性_5: 每个参数有 file:line 定位；每条限制有具体失效条件
  使用增益_25:
    质量增益_15: 四类注入缺陷（冲突/无源数值/清单缺项/步骤缺判断）全部命中
    效率增益_5: 参数台账自动对齐，免人工翻配置比对
    增益可验证性_5: 有源率/无源数/覆盖率/步骤完整率可对任意两份章节计算
  创新增益_15:
    新增能力_5: 别名驱动的正文-来源对齐 + 带单位数值的全库回查
    方法改进_5: 参数台账、步骤四要素、复现九项三张清单互相约束
    创新证据_5: 缺陷夹具证明检测边界；不声称基线分数
  可靠体验_10:
    调用与易用性_3: 两条命令完成对齐与核对
    运行稳定性_4: 材料缺失时降级 partial，不补造数值
    异常处理_3: 五类异常处置（配置冲突/仅默认值/版本不明/种子未固定/无单位）
  生态贡献_10:
    文档完整性_3: SKILL.md + method.md + README + 模板
    资源可复用性_4: params.json/manifest.json/steps.json 格式通用
    分享推广价值_3: 适用于任何实验章节的复现自查
gates:
  - sourced_rate = 1.00
  - unsourced = 0 且 conflicts = 0
  - repro_coverage = 1.00
  - step_completeness = 1.00
  - limitation_specificity = 1.00
