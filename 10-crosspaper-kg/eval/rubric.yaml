package: 10-crosspaper-kg
single_point: 跨篇同名归一（含不得合并的显式判定）+ 每条边绑原文引文 + 至少 3 条真执行查询
scoring:
  实际效果_40:
    任务完成度_15: 两篇独立材料合成一个可查询图谱，节点/边/非合并判定齐全
    结果正确性_15: 缩写解析正确、同名不同样品不合并、边引文逐字可回原文
    结果完整性_5: 每条边带 paper_id/paragraph_id/doi/quote；每条非合并带两侧证据
    结果可核验性_5: 四个查询都能给出证据列表，空结果显式判失败
  使用增益_25:
    质量增益_15: 五类缺陷（变体未归一/冲突合并/改写引文/空查询/缩写无全称）全部可判
    效率增益_5: 一次构建产出节点、边、非合并、查询结果四件套
    增益可验证性_5: 覆盖率/引文率/查询有证据率可对任意语料重算
  创新增益_15:
    新增能力_5: 把"不得合并"从隐含经验变成带证据的结构化记录
    方法改进_5: 归一键 + 身份限定字段 + 引文子串校验 + 查询证据绑定
    创新证据_5: 五个注入用例与 6 跨篇节点/1 非合并的可复现结果
  可靠体验_10:
    调用与易用性_3: 单命令构建，单命令查询
    运行稳定性_4: 引文缺失/段落号错/缩写无解都有明确码，不静默通过
    异常处理_3: K01–K06 六类异常有定位信息（节点/边/查询 id）
  生态贡献_10:
    文档完整性_3: SKILL.md + method.md + 字段说明 + README
    资源可复用性_4: kg.json / queries_result.json 可被下游直接消费
    分享推广价值_3: 适用于任何"多篇材料同一主题"的综述前置整理
gates:
  - 正例 pass=true：归一覆盖率 1.00、边引文率 1.00、查询有证据率 1.00
  - 非合并判定 ≥1 且两侧均有原文证据
  - 查询不得出现无来源的结论
