package: 08-column-reflow
single_point: 双栏阅读顺序重排（先左栏整栏、再右栏；通栏块按 y 插入）
scoring:
  实际效果_40:
    任务完成度_15: 输出带页码/栏/坐标的段落序列，可直接用于后续翻译或抽取
    结果正确性_15: 与已知真值逐段一致（本包演示 100%），句子不串栏
    结果完整性_5: 正文块全部保留；页眉页脚剔除；图表题注按其位置保留
    结果可核验性_5: 每段有 page/col/bbox，可回原页核对
  使用增益_25:
    质量增益_15: 位置命中 100% vs 朴素基线约 30%；逆序 0 vs 20
    效率增益_5: 一次重排替代人工逐句调整顺序
    增益可验证性_5: eval/measure.py 用真值算三项指标，可重复
  创新增益_15:
    新增能力_5: 通栏块分带 + 栏内整栏排序，而不是逐行 y 排序
    方法改进_5: 断词拼接、同栏续段合并、页眉页脚跨页去重
    创新证据_5: 已知真值文档 + 基线对照，指标可复算
  可靠体验_10:
    调用与易用性_3: 一条命令出三段产物
    运行稳定性_4: 单栏/多栏/无文字层分别有明确状态
    异常处理_3: 五类异常处置（三栏/跨页/边注/图片表格/留白过小）
  生态贡献_10:
    文档完整性_3: SKILL.md + method.md + 生成器 + 真值
    资源可复用性_4: 生成器可改参数造不同版式样本；measure 适用任何带标记 PDF
    分享推广价值_3: 版式样本与真值可直接作为解析 Benchmark
gates:
  - 重排结果与真值逐段一致（order_match=true，inversions=0）
  - 页眉页脚泄漏 = 0
  - 串栏疑似 = 0
