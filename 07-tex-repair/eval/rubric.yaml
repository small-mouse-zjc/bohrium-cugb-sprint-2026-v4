package: 07-tex-repair
single_point: 模板要求逐项对齐 + 编译根因定位 + 可复现构建清单
scoring:
  实际效果_40:
    任务完成度_15: 交付可编译 .tex 与 PDF；模板必填项齐全
    结果正确性_15: 修复后公式/表格/引用/版式与原文意图一致；表格列数与行一致
    结果完整性_5: 改动点、必填项、配套文件（bib/图）逐项覆盖
    结果可核验性_5: texfit/logdiag 给文件:行号；build_manifest 给命令/轮次/哈希
  使用增益_25:
    质量增益_15: 损坏工程 10 处违规全部定位；修复版 0 违规、真实编译 0 错误
    效率增益_5: 静态检查在编译前抓出 8 类问题，减少反复编译
    增益可验证性_5: 同一模板下可对任意工程算违规数/错误数/收敛状态
  创新增益_15:
    新增能力_5: 编译前静态合规（T01–T08）+ 编译后根因目录（E01–E10）双通道
    方法改进_5: 按根因顺序修（E02→E01→E10→E03→引用），并标记级联
    创新证据_5: 真实 TeX Live 2022 日志回归 + 修复前/后对照
  可靠体验_10:
    调用与易用性_3: 两条命令完成体检与编译
    运行稳定性_4: 无 TeX 时明确 static_only，不谎称通过
    异常处理_3: 缺包/缺字体/模板缺失/级联/中文五类处置
  生态贡献_10:
    文档完整性_3: SKILL.md + error_catalog + compile_evidence + README
    资源可复用性_4: template.yaml 通用；demo 工程可直接当回归样例
    分享推广价值_3: 适用于任何期刊模板迁移
gates:
  - 损坏工程命中 T01–T08 全部八类
  - 修复版 texfit 0 违规
  - 真实编译 errors=0 且 converged
  - 无 TeX 时 status=static_only 且注明未编译
