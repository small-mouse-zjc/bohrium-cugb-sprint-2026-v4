package: 04-related-matrix
single_point: 先建"工作×维度"矩阵，再由共同局限推空白，最后逐句绑定引用与证据
scoring:
  实际效果_40:
    任务完成度_15: 四段齐全（背景/相关工作/空白/贡献）；相关工作按矩阵分组而非逐篇罗列
    结果正确性_15: 转述与矩阵 evidence.locator 一致；空白仅来自 gaps；冲突条件写清，不选边
    结果完整性_5: 五维矩阵覆盖全部条目；关键文献与近作均引用
    结果可核验性_5: 每格有 locator/quote；每论断有引用；每条贡献有 §/Fig./Table
  使用增益_25:
    质量增益_15: 注入 4 类缺陷（无引用/悬空/单篇支撑空白/贡献无证据）全部命中
    效率增益_5: 矩阵一次成型，写正文不再回头翻文献；核对脚本免人工逐条翻
    增益可验证性_5: 5 个比率可对任意两份草稿计算，定义见 references/method.md
  创新增益_15:
    新增能力_5: 空白由"共同局限+无人覆盖"机器推导，不是灵感式断言
    方法改进_5: 矩阵→分组→空白→绑定 的固定次序；冲突单独列
    创新证据_5: 注入夹具证明检测边界；不声称基线分数
  可靠体验_10:
    调用与易用性_3: 3 条命令 + 四段模板
    运行稳定性_4: 文献为空时降级为 partial，不编造相关工作
    异常处理_3: 五种异常处置（缺原文/冲突/格式未知/数值不一致/库为空）
  生态贡献_10:
    文档完整性_3: SKILL.md + method.md + README
    资源可复用性_4: works.json 与 dimensions.json 是通用格式，可换主题复用
    分享推广价值_3: 适合任何"多文献分组比较"场景
gates:
  - claim_citation_rate = 1.00
  - 悬空引用 = 0
  - key_work_coverage = 1.00
  - gap_support_rate = 1.00
  - contribution_evidence_rate = 1.00
