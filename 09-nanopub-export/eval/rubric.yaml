package: 09-nanopub-export
single_point: 一句一断言 + 逐字证据 + JSON-LD/TriG 四层序列化并回解析
scoring:
  实际效果_40:
    任务完成度_15: 每条断言可独立判断真假；主体/关系/客体/限定齐全
    结果正确性_15: 证据逐字、方向正确、限定未丢
    结果完整性_5: 断言/证据/来源/置信依据/标识符齐备
    结果可核验性_5: 每条有 paragraph_id 与 quote，可回原文
  使用增益_25:
    质量增益_15: 四类注入缺陷（并列句/改写证据/缺段落号/重复）全部命中
    效率增益_5: 机器校验替代人工逐条回查
    增益可验证性_5: 原子率/逐字率/来源率/回解析可对任意清单计算
  创新增益_15:
    新增能力_5: 从"整段摘要"变成"可判断真假的原子断言 + 命名图"
    方法改进_5: 受控关系词表 + 最小充分证据长度 + 回解析闭环
    创新证据_5: 缺陷夹具与 TriG 回解析证明边界
  可靠体验_10:
    调用与易用性_3: 一条命令产出四件套
    运行稳定性_4: 无文本层/跨图表/多来源有明确处置
    异常处理_3: 五类异常（跨段/跨图表/扫描件/多来源/方向存疑）
  生态贡献_10:
    文档完整性_3: SKILL.md + method.md + 字段说明 + README
    资源可复用性_4: assertions.json 与 TriG 可直接被下游使用
    分享推广价值_3: 可用于任何论文结论的结构化
gates:
  - N01–N08 全过（原子率/逐字率/来源率 = 1.00）
  - TriG 命名图数 = 断言数，quote 数与断言数一致
