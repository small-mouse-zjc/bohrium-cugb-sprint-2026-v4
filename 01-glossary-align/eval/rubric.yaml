package: 01-glossary-align
single_point: 术语锁定 + 段落级双语对照 + 机器质检
scoring:
  实际效果_40:
    任务完成度_15:
      - 检查：bilingual.json 覆盖源文献全部段落，逐段给出 target，无"同上/略"
      - 检查：bilingual.md 可按 [P0001] 回查原文页码
    结果正确性_15:
      - 检查：术语一致率 = 1.00（qc.json rates.term_consistency）
      - 检查：数字保真率 ≥ 0.95、引用标记保真率 = 1.00
      - 检查：否定/限定/因果未被改写（人工抽 3 段对照）
    结果完整性_5:
      - 检查：正文段落 + 图表题注 + 表头 + 文献标记均在内
    结果可核验性_5:
      - 检查：每段有 basis；uncertain 段有 risk；页码可定位
  使用增益_25:
    质量增益_15:
      - 证据：baseline/fixtures 三类缺陷全部被 qc.py 命中（selftest 输出）
      - 证据：同输入下 skill 输出 vs 基础 Agent 输出的五项比率差（eval/metrics.py）
    效率增益_5:
      - 证据：术语表一次锁定、全篇回填，无需逐段查词；批量 6–10 段/请求
    增益可验证性_5:
      - 证据：eval/metrics.py 可对任意两份结果目录算出对比表，指标定义在 references/method.md
  创新增益_15:
    新增能力_5:
      - 术语"锁定 + 强制回填 + 违规定位"，不是提示词建议
    方法改进_5:
      - 段落 ID 先定后译、译文禁止重排；质检把"译得好不好"变成五项比率
    创新证据_5:
      - 注入缺陷夹具 + 五项比率，证明边界：能抓术语漂移/漏段/数字丢失，不能判断译文文采
  可靠体验_10:
    调用与易用性_3: SKILL.md 五步含可直接执行的命令
    运行稳定性_4: 长文分批落盘；无文字层置 partial 而非编造
    异常处理_3: 六类异常有明确处置（SKILL.md §5）
  生态贡献_10:
    文档完整性_3: SKILL.md + references/method.md + README
    资源可复用性_4: 术语表 CSV 格式通用；脚本无第三方依赖（PDF 仅需 PyMuPDF 或 pypdf）
    分享推广价值_3: 可用于任何学科的术语锁定翻译
gates:
  - name: 正例五项比率
    rule: coverage≥0.98, term=1.00, number≥0.95, citation=1.00, flag=1.00
  - name: 缺陷检出
    rule: F1/F2/F3 全部命中，否则判定质检器失效
